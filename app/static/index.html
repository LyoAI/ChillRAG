<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ChillRAG</title>
<style>
  :root {
    --bg: #0b0e14; --surface: #10141c; --surface-2: #151a24; --raise: #1a2029;
    --line: #222936; --line-soft: #1b212c;
    --ink: #e9edf3; --muted: #8b95a5; --faint: #5d6675;
    --accent: #6d9bff; --accent-2: #7ce0ff;
    --grad: linear-gradient(135deg, #6d9bff 0%, #7ce0ff 100%);
    --user-bubble: linear-gradient(135deg, #4f7ef0, #58a6d8);
    --ok: #3fd68f; --err: #ff6b6b;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f9; --surface: #ffffff; --surface-2: #f2f4f8; --raise: #ffffff;
            --line: #e2e6ee; --line-soft: #e9edf3;
            --ink: #1a2230; --muted: #66707f; --faint: #98a1b0;
            --user-bubble: linear-gradient(135deg, #4f7ef0, #4aa3d8); }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 14px/1.65 var(--sans);
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px; height: 54px; flex: none;
    padding: 0 18px; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter: blur(14px); position: sticky; top: 0; z-index: 10;
  }
  .mark {
    width: 28px; height: 28px; border-radius: 9px; background: var(--grad);
    color: #071018; font-size: 15px; font-weight: 700; line-height: 28px; text-align: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 4px 14px rgba(90,150,255,.25);
  }
  .brand { font-weight: 650; letter-spacing: .2px; font-size: 14.5px; }
  .brand em { font-style: normal; color: var(--faint); font-weight: 450; margin-left: 8px; font-size: 12px; }
  .spacer { flex: 1; }
  select {
    font: 12.5px/1 var(--sans); color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    max-width: 220px; cursor: pointer; transition: border-color .15s;
  }
  select:focus { outline: none; border-color: var(--accent); }
  .who {
    font: 11.5px var(--mono); color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 11px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
         box-shadow: 0 0 8px var(--ok); display: inline-block; margin-right: 7px; }

  /* ---------- thread ---------- */
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .thread { max-width: 780px; margin: 0 auto; padding: 28px 22px 30px; }
  .msg { margin-bottom: 22px; animation: rise .28s cubic-bezier(.2,.7,.3,1) both; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--user-bubble); color: #fff; border-radius: 14px 14px 4px 14px;
    padding: 10px 15px; max-width: 72%; white-space: pre-wrap; word-break: break-word;
    box-shadow: 0 4px 16px rgba(60,110,220,.22);
  }
  .msg .kicker {
    display: flex; align-items: center; gap: 8px; margin-bottom: 7px;
    font: 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint);
  }
  .kicker .glyph {
    width: 16px; height: 16px; border-radius: 5px; background: var(--grad);
    color: #071018; font-size: 9px; font-weight: 700; line-height: 16px; text-align: center;
  }
  .msg.ai .bubble {
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px;
    padding: 15px 18px; white-space: pre-wrap; word-break: break-word;
    font-size: 14px; line-height: 1.75;
    box-shadow: 0 1px 0 rgba(0,0,0,.12), 0 10px 30px rgba(0,0,0,.16);
  }
  .msg.ai strong { font-weight: 650; color: var(--ink); }
  .msg.ai code {
    font: 12.5px/1.5 var(--mono); background: var(--surface-2);
    border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 5px;
  }
  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; transform: translateY(0); }
                     30% { opacity: 1; transform: translateY(-3px); } }

  /* ---------- empty state ---------- */
  .hero { text-align: center; padding: 11vh 0 20px; }
  .hero .flake {
    font-size: 44px; line-height: 1; background: var(--grad);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 6px 24px rgba(100,160,255,.3));
  }
  .hero h2 { font-size: 19px; font-weight: 650; margin: 18px 0 6px; letter-spacing: .2px; }
  .hero p { color: var(--muted); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 26px; }
  .chip {
    font: 12.5px var(--sans); color: var(--muted); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer;
    transition: all .18s;
  }
  .chip:hover { color: var(--ink); border-color: var(--accent); transform: translateY(-1px);
                box-shadow: 0 4px 14px rgba(0,0,0,.18); }

  /* ---------- composer ---------- */
  .dock { flex: none; border-top: 1px solid var(--line);
          background: color-mix(in srgb, var(--surface) 86%, transparent);
          backdrop-filter: blur(14px); padding: 14px 22px 18px; }
  .composer { max-width: 780px; margin: 0 auto; }
  .box {
    display: flex; align-items: flex-end; gap: 10px; background: var(--raise);
    border: 1px solid var(--line); border-radius: 14px; padding: 9px 9px 9px 16px;
    transition: border-color .18s, box-shadow .18s;
  }
  .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(109,155,255,.14); }
  textarea {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--ink); font: 14px/1.6 var(--sans); max-height: 160px; padding: 7px 0;
  }
  textarea::placeholder { color: var(--faint); }
  .send {
    flex: none; width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer;
    background: var(--grad); color: #071018; font-size: 16px; font-weight: 700; line-height: 38px;
    transition: transform .12s, filter .15s, opacity .15s;
  }
  .send:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  .send:active:not(:disabled) { transform: scale(.94); }
  .send:disabled { opacity: .4; cursor: default; }
  .hint { display: flex; justify-content: space-between; margin-top: 8px;
          font: 11.5px var(--mono); color: var(--faint); padding: 0 4px; min-height: 15px; }
  .hint .state.err { color: var(--err); }

  /* ---------- login ---------- */
  #gate { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center;
          justify-content: center; background:
            radial-gradient(1000px 500px at 20% -10%, rgba(109,155,255,.13), transparent 60%),
            radial-gradient(800px 500px at 90% 110%, rgba(124,224,255,.10), transparent 60%), var(--bg); }
  .gate-card {
    width: min(360px, calc(100vw - 40px)); background: var(--surface);
    border: 1px solid var(--line); border-radius: 18px; padding: 30px 28px 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.4);
    animation: rise .35s cubic-bezier(.2,.7,.3,1) both;
  }
  .gate-card .mark { width: 42px; height: 42px; border-radius: 13px; font-size: 22px; line-height: 42px; margin-bottom: 18px; }
  .gate-card h1 { font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .gate-card .sub { color: var(--muted); font-size: 13px; margin: 4px 0 18px; }
  .field label { display: block; font: 11px var(--mono); letter-spacing: .1em;
                 text-transform: uppercase; color: var(--faint); margin: 14px 0 6px; }
  .field input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 13px; color: var(--ink); font: 14px var(--sans);
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus { outline: none; border-color: var(--accent);
                       box-shadow: 0 0 0 3px rgba(109,155,255,.14); }
  .go {
    width: 100%; margin-top: 22px; padding: 11px; border: none; border-radius: 10px;
    background: var(--grad); color: #071018; font: 600 14px var(--sans); cursor: pointer;
    transition: transform .12s, filter .15s;
  }
  .go:hover { filter: brightness(1.08); }
  .go:active { transform: scale(.98); }
  .gate-msg { font-size: 12.5px; color: var(--err); margin-top: 12px; min-height: 16px; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid var(--bg); }
</style>
</head>
<body>

<!-- login gate -->
<div id="gate" hidden>
  <div class="gate-card">
    <div class="mark">❄</div>
    <h1>Sign in to ChillRAG</h1>
    <p class="sub">Document question answering over your corpus.</p>
    <div class="field"><label>Username</label><input id="user" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
    <button class="go" id="login">Sign in</button>
    <div class="gate-msg" id="gate-msg"></div>
  </div>
</div>

<!-- app shell -->
<div id="shell" style="display:none; flex:1; min-height:0">
  <div class="topbar">
    <div class="mark">❄</div>
    <div class="brand">ChillRAG<em>doc qa</em></div>
    <div class="spacer"></div>
    <span class="who" id="who" hidden></span>
    <select id="source" hidden></select>
  </div>

  <main>
    <div class="thread" id="thread">
      <div class="hero" id="hero">
        <div class="flake">❄</div>
        <h2>Ask your documents.</h2>
        <p>Answers cite the exact files and pages they come from.</p>
        <div class="chips" id="chips"></div>
      </div>
    </div>
  </main>

  <div class="dock">
    <div class="composer">
      <div class="box">
        <textarea id="question" rows="1"
                  placeholder="Ask anything about the selected corpus…"></textarea>
        <button class="send" id="ask" title="Send">↑</button>
      </div>
      <div class="hint">
        <span class="state" id="state"></span>
        <span>⌘ ↵ to send</span>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

const EXAMPLES = [
  "What was the total operating revenue in 2021?",
  "Summarize the main risk factors.",
  "List the top shareholders and their stakes.",
];

// ---- session bootstrap ----------------------------------------------------
(async () => {
  const ok = await loadSources();
  $("gate").hidden = ok;
  $("shell").style.display = ok ? "flex" : "none";
})();

$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });
$("login").addEventListener("click", signIn);
async function signIn() {
  const msg = $("gate-msg");
  msg.textContent = "";
  const resp = await fetch("/space/api/passport/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("user").value, passwd: $("pass").value }),
  });
  const body = await resp.json().catch(() => ({}));
  if (resp.status !== 200 || body.code !== 0) {
    msg.textContent = body.msg || ("Sign-in failed (" + resp.status + ")");
    return;
  }
  if (body.data && body.data.userId != null) {
    $("who").hidden = false;
    $("who").textContent = "<span class='dot'></span>user " + body.data.userId;
  }
  if (await loadSources()) {
    $("gate").hidden = true;
    $("shell").style.display = "flex";
    $("question").focus();
  }
}

async function loadSources() {
  const resp = await fetch("/space/api/service/asset-file/resource");
  if (resp.status === 401) return false;
  const body = await resp.json();
  const sel = $("source");
  sel.hidden = false;
  sel.innerHTML = "";
  for (const s of body.data || []) {
    const opt = document.createElement("option");
    opt.value = s.sourceId;
    opt.textContent = s.resourceName;
    sel.appendChild(opt);
  }
  buildChips();
  return true;
}

function buildChips() {
  const box = $("chips");
  box.innerHTML = "";
  for (const text of EXAMPLES) {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = text;
    chip.addEventListener("click", () => { $("question").value = text; $("question").focus(); });
    box.appendChild(chip);
  }
}

// ---- asking ---------------------------------------------------------------
$("ask").addEventListener("click", ask);
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask();
});
$("question").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 160) + "px";
});

async function ask() {
  const question = $("question").value.trim();
  if (!question || $("ask").disabled) return;
  const sourceName = $("source").selectedOptions[0]?.textContent || "";
  $("ask").disabled = true;
  $("question").value = ""; $("question").style.height = "auto";
  $("hero")?.remove();

  addUser(question);
  const bubble = addAi(sourceName);

  const t0 = performance.now();
  const timer = setInterval(() => {
    setState("retrieving · " + Math.round((performance.now() - t0) / 1000) + "s");
  }, 500);
  try {
    const resp = await fetch("/space/api/service/sse/llmapi/ht/text/post-answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question,
        source_category_filter: JSON.stringify({ [String($("source").value)]: [] }),
        mode: 0,
      }),
    });
    if (resp.status !== 200) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.msg || ("HTTP " + resp.status));
    }
    const text = await readSse(resp);
    bubble.innerHTML = render(text) || "<em style='color:var(--muted)'>(empty answer)</em>";
    setState("answered in " + ((performance.now() - t0) / 1000).toFixed(1) + "s");
  } catch (err) {
    bubble.closest(".msg").remove();
    setState(err.message, true);
  } finally {
    clearInterval(timer);
    $("ask").disabled = false;
    $("question").focus();
  }
}

function addUser(text) {
  const msg = document.createElement("div");
  msg.className = "msg user";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  msg.appendChild(b);
  $("thread").appendChild(msg);
  scrollEnd();
}

function addAi(sourceName) {
  const msg = document.createElement("div");
  msg.className = "msg ai";
  const kicker = document.createElement("div");
  kicker.className = "kicker";
  kicker.innerHTML = "<span class='glyph'>❄</span><span>chillrag · " +
    escapeHtml(sourceName).toLowerCase() + "</span>";
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = "<span class='typing'><i></i><i></i><i></i></span>";
  msg.appendChild(kicker);
  msg.appendChild(b);
  $("thread").appendChild(msg);
  scrollEnd();
  return b;
}

// Vendor SSE framing: every "data: " line is payload; newlines and spaces
// travel as the literal markers [new_line] / [whitespace].
async function readSse(resp) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let raw = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    for (const line of decoder.decode(value, { stream: true }).split("\n")) {
      if (line.startsWith("data:")) raw += line.slice(5).replace(/^\s+/, "");
    }
  }
  let text = raw.replaceAll("[new_line]", "\n").replaceAll("[whitespace]", " ");
  const cut = text.indexOf("</strong>");           // drop the stream preamble
  if (cut !== -1) text = text.slice(cut + "</strong>".length);
  return text.trimStart();
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function render(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function setState(msg, isErr) {
  $("state").className = "state" + (isErr ? " err" : "");
  $("state").textContent = msg || "";
}
function scrollEnd() { document.querySelector("main").scrollTop = 1e9; }
</script>
</body>
</html>
