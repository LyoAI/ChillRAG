<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ChillRAG</title>
<style>
  :root {
    /* Morandi — dusty, low-saturation, warm-leaning */
    --bg: #efede8;
    --sidebar: #e8e5df;
    --panel: #f8f6f2;
    --panel-2: #f2efe9;
    --ink: #3b3732;
    --muted: #7c766c;
    --faint: #a39c91;
    --line: #ddd8cf;
    --sage: #93a88e;       --sage-deep: #7d9578;
    --dusk: #8aa2b0;
    --clay: #c2a08a;
    --err: #b96a5f;
    --shadow: 0 1px 2px rgba(70,60,50,.05), 0 8px 28px rgba(70,60,50,.07);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #24211d; --sidebar: #1d1b18; --panel: #2b2823; --panel-2: #312d28;
            --ink: #e9e4dc; --muted: #a49c90; --faint: #6f685e; --line: #3a352e;
            --sage: #9db39a; --sage-deep: #aac0a6; --dusk: #9bb3c0; --clay: #c9a892;
            --err: #d08a7c; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 32px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 14.5px/1.7 var(--sans);
    -webkit-font-smoothing: antialiased; display: flex; overflow: hidden;
  }

  /* ================= sidebar ================= */
  .sidebar {
    width: 264px; flex: none; background: var(--sidebar);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    padding: 18px 14px; gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: .2px; padding: 0 6px; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--sage), var(--dusk));
    color: #fff; font-size: 15px; line-height: 30px; text-align: center; flex: none;
  }
  #new-chat {
    width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 11px;
    background: var(--panel); color: var(--ink); font: 600 13.5px var(--sans); cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background .15s, border-color .15s;
  }
  #new-chat:hover { background: var(--panel-2); border-color: var(--sage); }
  .sessions { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; margin: 0 -4px; padding: 0 4px; }
  .session {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 9px;
    cursor: pointer; color: var(--muted); font-size: 13.5px; position: relative;
    transition: background .12s, color .12s;
  }
  .session:hover { background: var(--panel); color: var(--ink); }
  .session.active { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .session .title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session .del {
    opacity: 0; border: none; background: none; color: var(--faint); cursor: pointer;
    font-size: 14px; padding: 0 2px; transition: opacity .12s, color .12s;
  }
  .session:hover .del { opacity: 1; }
  .session .del:hover { color: var(--err); }
  .sessions .none { color: var(--faint); font-size: 12.5px; text-align: center; padding: 18px 0; }
  .side-foot { font: 11.5px var(--mono); color: var(--faint); padding: 0 6px; }

  /* ================= main ================= */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .top {
    flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 22px;
    border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 5;
  }
  .top .label { font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  #source {
    font: 13px var(--sans); color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; min-width: 180px;
    cursor: pointer; transition: border-color .15s;
  }
  #source:focus { outline: none; border-color: var(--sage); }
  .convo { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .convo-inner { max-width: 820px; margin: 0 auto; padding: 26px 24px 20px; }

  .empty { text-align: center; color: var(--muted); padding: 12vh 20px 0; }
  .empty .flake {
    font-size: 44px; line-height: 1; margin-bottom: 18px;
    filter: drop-shadow(0 8px 24px rgba(120,140,120,.35));
  }
  .empty h2 { font-size: 19px; font-weight: 640; color: var(--ink); margin-bottom: 6px; letter-spacing: .2px; }
  .empty p { font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-top: 26px; }
  .chip {
    font: 12.5px var(--sans); color: var(--muted); background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer;
    transition: all .16s;
  }
  .chip:hover { color: var(--ink); border-color: var(--sage); transform: translateY(-1px); box-shadow: var(--shadow); }

  .msg { margin-bottom: 24px; animation: rise .3s cubic-bezier(.2,.7,.3,1) both; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 78%; background: var(--sage); color: #fff; border-radius: 15px 15px 4px 15px;
    padding: 11px 16px; white-space: pre-wrap; word-break: break-word; font-size: 14.5px;
    box-shadow: 0 2px 10px rgba(120,140,120,.28);
  }
  .msg.ai { position: relative; padding-left: 42px; }
  .msg.ai::before {
    content: "❄"; position: absolute; left: 0; top: 1px; width: 30px; height: 30px;
    border-radius: 9px; background: linear-gradient(135deg, var(--sage), var(--dusk));
    color: #fff; text-align: center; line-height: 30px; font-size: 14px;
  }
  .msg.ai .bubble {
    background: none; border: none; box-shadow: none; padding: 2px 0 0;
    white-space: pre-wrap; word-break: break-word; font-size: 14.5px; line-height: 1.78;
  }
  .msg.ai .bubble strong { font-weight: 650; }
  .msg.ai .bubble code {
    font: 12.5px/1.5 var(--mono); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 1px 5px;
  }
  .msg.ai .status {
    font: 12px var(--mono); color: var(--faint); margin: 0 0 7px 0; min-height: 0;
    transition: opacity .2s; letter-spacing: .02em;
  }
  .msg.ai .status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--sage); margin-right: 7px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,60%,100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  /* ================= composer ================= */
  .dock { flex: none; border-top: 1px solid var(--line); padding: 16px 22px 20px;
          background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(12px); }
  .composer { max-width: 820px; margin: 0 auto; }
  .box {
    display: flex; align-items: flex-end; gap: 10px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px 12px 18px;
    transition: border-color .18s, box-shadow .18s;
  }
  .box:focus-within { border-color: var(--sage); box-shadow: 0 0 0 3px rgba(147,168,142,.18); }
  textarea {
    flex: 1; background: none; border: none; outline: none; resize: none;
    color: var(--ink); font: 15px/1.6 var(--sans); min-height: 44px; max-height: 200px; padding: 8px 0;
  }
  textarea::placeholder { color: var(--faint); }
  #send {
    flex: none; width: 42px; height: 42px; border-radius: 12px; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--sage), var(--dusk)); color: #fff; font-size: 18px;
    line-height: 42px; text-align: center; transition: transform .12s, filter .15s, opacity .15s;
  }
  #send:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }
  #send:active:not(:disabled) { transform: scale(.94); }
  #send:disabled { opacity: .4; cursor: default; }
  .hint { text-align: center; font: 11.5px var(--mono); color: var(--faint); margin-top: 9px; letter-spacing: .03em; }

  /* ================= login gate ================= */
  #gate { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
          background: radial-gradient(900px 500px at 15% -10%, rgba(147,168,142,.22), transparent 60%),
                      radial-gradient(800px 500px at 90% 110%, rgba(138,162,176,.18), transparent 60%), var(--bg); }
  .gate-card {
    width: min(380px, calc(100vw - 40px)); background: var(--panel); border: 1px solid var(--line);
    border-radius: 20px; padding: 34px 30px 28px; box-shadow: 0 30px 80px rgba(50,42,34,.25);
    animation: rise .4s cubic-bezier(.2,.7,.3,1) both;
  }
  .gate-card .mark { width: 44px; height: 44px; border-radius: 13px; font-size: 22px; line-height: 44px;
    text-align: center; color: #fff; background: linear-gradient(135deg, var(--sage), var(--dusk)); margin-bottom: 20px; }
  .gate-card h1 { font-size: 18px; font-weight: 650; letter-spacing: .2px; }
  .gate-card .sub { color: var(--muted); font-size: 13px; margin: 4px 0 18px; }
  .field label { display: block; font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin: 14px 0 6px; }
  .field input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px;
    padding: 11px 14px; color: var(--ink); font: 14px var(--sans); transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 3px rgba(147,168,142,.18); }
  .go { width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 11px; cursor: pointer;
        background: linear-gradient(135deg, var(--sage), var(--dusk)); color: #fff; font: 600 14px var(--sans);
        transition: transform .12s, filter .15s; }
  .go:hover { filter: brightness(1.06); }
  .go:active { transform: scale(.98); }
  .gate-msg { font-size: 12.5px; color: var(--err); margin-top: 12px; min-height: 16px; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: content-box; }

  @media (max-width: 760px) {
    .sidebar { display: none; }
    .top { padding: 10px 16px; }
    .convo-inner { padding: 20px 14px; }
    .dock { padding: 14px 14px 16px; }
  }
</style>
</head>
<body>

<!-- login gate -->
<div id="gate">
  <div class="gate-card">
    <div class="mark">❄</div>
    <h1>Sign in to ChillRAG</h1>
    <p class="sub">Ask your documents. Answers cite the files and pages they come from.</p>
    <div class="field"><label>Username</label><input id="user" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="pass" type="password" autocomplete="current-password"></div>
    <button class="go" id="login">Sign in</button>
    <div class="gate-msg" id="gate-msg"></div>
  </div>
</div>

<!-- app shell -->
<div id="shell" style="display:none">
  <aside class="sidebar">
    <div class="brand"><span class="mark">❄</span>ChillRAG</div>
    <button id="new-chat">＋ New chat</button>
    <div class="sessions" id="sessions"></div>
    <div class="side-foot" id="who"></div>
  </aside>

  <div class="main">
    <header class="top">
      <span class="label">Corpus</span>
      <select id="source"></select>
    </header>

    <div class="convo" id="convo">
      <div class="convo-inner" id="thread">
        <div class="empty" id="empty">
          <div class="flake">❄</div>
          <h2>Ask your documents.</h2>
          <p>Retrieval, reasoning and citation, grounded in your corpus.</p>
          <div class="chips" id="chips"></div>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="composer">
        <div class="box">
          <textarea id="question" rows="1" placeholder="Ask anything about the selected corpus…"></textarea>
          <button id="send" title="Send">↑</button>
        </div>
        <div class="hint">ChillRAG may cite specific files and pages · ⌘↵ to send</div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SESSIONS_KEY = "chillrag.sessions";

const EXAMPLES = [
  "What was the total operating revenue in 2021?",
  "Summarize the main risk factors.",
  "List the top shareholders and their stakes.",
];
const TOOL_LABELS = { get_context: "Reading surrounding context…", get_toc: "Reading the table of contents…",
  get_materials: "Listing documents…", calculate: "Calculating…" };

let current = { id: null, title: "", messages: [] };
let sending = false;

/* ---------- bootstrap ---------- */
(async () => {
  if (await loadSources()) enter();
})();
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });
$("login").addEventListener("click", signIn);
async function signIn() {
  const msg = $("gate-msg"); msg.textContent = "";
  const resp = await fetch("/space/api/passport/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username: $("user").value, passwd: $("pass").value }),
  });
  const body = await resp.json().catch(() => ({}));
  if (resp.status !== 200 || body.code !== 0) {
    msg.textContent = body.msg || ("Sign-in failed (" + resp.status + ")"); return;
  }
  if (await loadSources()) enter();
}
async function loadSources() {
  const resp = await fetch("/space/api/service/asset-file/resource");
  if (resp.status === 401) return false;
  const body = await resp.json();
  const sel = $("source"); sel.innerHTML = "";
  for (const s of body.data || []) {
    const opt = document.createElement("option");
    opt.value = s.sourceId; opt.textContent = s.resourceName;
    sel.appendChild(opt);
  }
  buildChips();
  return true;
}
function enter() {
  $("gate").style.display = "none";
  $("shell").style.display = "flex";
  renderSessions();
  $("question").focus();
}
function buildChips() {
  const box = $("chips"); box.innerHTML = "";
  for (const text of EXAMPLES) {
    const chip = document.createElement("button");
    chip.className = "chip"; chip.textContent = text;
    chip.addEventListener("click", () => { $("question").value = text; $("question").focus(); });
    box.appendChild(chip);
  }
}

/* ---------- sessions (localStorage) ---------- */
function sessions() {
  try { return JSON.parse(localStorage.getItem(SESSIONS_KEY) || "[]"); } catch { return []; }
}
function saveSessions(list) { localStorage.setItem(SESSIONS_KEY, JSON.stringify(list)); }
function renderSessions() {
  const box = $("sessions"); box.innerHTML = "";
  const list = sessions().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  if (!list.length) { box.innerHTML = '<div class="none">No conversations yet</div>'; return; }
  for (const s of list) {
    const row = document.createElement("div");
    row.className = "session" + (s.id === current.id ? " active" : "");
    const title = document.createElement("span"); title.className = "title";
    title.textContent = s.title || "Untitled";
    title.addEventListener("click", () => loadSession(s.id));
    const del = document.createElement("button"); del.className = "del"; del.textContent = "✕";
    del.addEventListener("click", (e) => { e.stopPropagation(); deleteSession(s.id); });
    row.appendChild(title); row.appendChild(del);
    box.appendChild(row);
  }
}
function newChat() {
  current = { id: null, title: "", messages: [] };
  $("thread").innerHTML = "";
  $("thread").appendChild(buildEmpty());
  renderSessions();
}
function loadSession(id) {
  const s = sessions().find((x) => x.id === id);
  if (!s) return;
  current = { id: s.id, title: s.title, messages: s.messages.slice() };
  $("thread").innerHTML = "";
  for (const m of s.messages) addMessage(m.role, m.content, false);
  renderSessions();
}
function deleteSession(id) {
  saveSessions(sessions().filter((x) => x.id !== id));
  if (current.id === id) newChat(); else renderSessions();
}
function persist() {
  if (!current.messages.length) return;
  const now = Date.now();
  let list = sessions().filter((x) => x.id !== current.id);
  if (!current.id) current.id = "s" + now.toString(36);
  if (!current.title) current.title = current.messages[0].content.slice(0, 40);
  list.push({ id: current.id, title: current.title, updatedAt: now, messages: current.messages });
  saveSessions(list);
  renderSessions();
}
function buildEmpty() {
  const div = document.createElement("div");
  div.className = "empty"; div.id = "empty";
  div.innerHTML = '<div class="flake">❄</div><h2>Ask your documents.</h2>' +
    '<p>Retrieval, reasoning and citation, grounded in your corpus.</p><div class="chips" id="chips"></div>';
  return div;
}

/* ---------- messages ---------- */
function addMessage(role, content, scroll = true) {
  const empty = $("empty"); if (empty) empty.remove();
  const msg = document.createElement("div");
  msg.className = "msg " + role;
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = role === "user" ? escapeHtml(content) : render(content);
  msg.appendChild(b);
  $("thread").appendChild(msg);
  if (scroll) scrollEnd();
  return msg;
}
function addAiPlaceholder() {
  const empty = $("empty"); if (empty) empty.remove();
  const msg = document.createElement("div");
  msg.className = "msg ai";
  const status = document.createElement("div"); status.className = "status";
  status.innerHTML = '<span class="dot"></span>Thinking…';
  const b = document.createElement("div"); b.className = "bubble";
  b.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  msg.appendChild(status); msg.appendChild(b);
  $("thread").appendChild(msg);
  scrollEnd();
  return { msg, status, bubble: b, raw: "" };
}

/* ---------- asking ---------- */
$("new-chat").addEventListener("click", newChat);
$("send").addEventListener("click", ask);
$("question").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(); });
$("question").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 200) + "px";
});

async function ask() {
  const q = $("question").value.trim();
  if (!q || sending) return;
  const sourceId = +$("source").value;
  const history = current.messages.map((m) => ({ role: m.role, content: m.content }));
  $("question").value = ""; $("question").style.height = "auto";
  sending = true; $("send").disabled = true;

  addMessage("user", q);
  current.messages.push({ role: "user", content: q });
  const ai = addAiPlaceholder();
  const t0 = performance.now();
  const tick = setInterval(() => {
    if (ai.raw === "") ai.status.innerHTML = '<span class="dot"></span>Thinking… ' +
      Math.round((performance.now() - t0) / 1000) + "s";
  }, 500);

  try {
    const resp = await fetch("/api/chat/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, source_id: sourceId, history }),
    });
    if (resp.status !== 200) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.msg || ("HTTP " + resp.status));
    }
    await readChatStream(resp, (ev) => {
      if (ev.type === "tool") {
        ai.status.innerHTML = '<span class="dot"></span>' + (TOOL_LABELS[ev.tool] || ("Working: " + ev.tool));
      } else if (ev.type === "delta") {
        ai.raw += ev.text;
        ai.bubble.innerHTML = render(ai.raw);
        ai.status.innerHTML = '<span class="dot"></span>Answering…';
        scrollEnd();
      } else if (ev.type === "error") {
        ai.bubble.innerHTML = '<em style="color:var(--err)">' + escapeHtml(ev.message) + "</em>";
      }
    });
    if (!ai.raw && ai.bubble.querySelector(".typing")) ai.bubble.innerHTML = "";
    ai.status.style.display = "none";
    current.messages.push({ role: "assistant", content: ai.raw || "(no answer)" });
  } catch (err) {
    ai.bubble.innerHTML = '<em style="color:var(--err)">' + escapeHtml(err.message) + "</em>";
    ai.status.style.display = "none";
    current.messages.push({ role: "assistant", content: "⚠ " + err.message });
  } finally {
    clearInterval(tick);
    sending = false; $("send").disabled = false;
    persist(); scrollEnd(); $("question").focus();
  }
}

async function readChatStream(resp, onEvent) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) !== -1) {
      const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
      for (const line of raw.split("\n")) {
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data) onEvent(JSON.parse(data));
      }
    }
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function render(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function scrollEnd() { $("convo").scrollTop = $("convo").scrollHeight; }
</script>
</body>
</html>
