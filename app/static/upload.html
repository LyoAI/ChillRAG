<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ChillRAG · Upload</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%2393a88e"/><stop offset="1" stop-color="%238aa2b0"/></linearGradient></defs><rect width="100" height="100" rx="26" fill="url(%23g)"/><g stroke="%23ffffff" stroke-width="9" stroke-linecap="round"><path d="M50 22v56"/><path d="M26.5 35.5l47 29"/><path d="M26.5 64.5l47-29"/></g></svg>'>
<link rel="stylesheet" href="/static/theme.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #shell { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .wrap { flex: 1; overflow-y: auto; width: 100%; max-width: 780px; margin: 0 auto;
          padding: 30px 20px 70px; }
  .hero { margin-bottom: 22px; }
  .hero h1 { font-size: var(--fs-xl); font-weight: 650; letter-spacing: .2px; }
  .hero p { color: var(--muted); font-size: var(--fs-md); margin-top: 6px; }
  .card + .card { margin-top: 16px; }
  .help { color: var(--faint); font-size: var(--fs-sm); margin-top: 7px; }
  .help.mono { font-family: var(--mono); font-size: var(--fs-xs); }

  /* ------------- drop zone ------------- */
  .drop {
    border: 1.5px dashed var(--line); border-radius: 16px; padding: 34px 20px;
    text-align: center; cursor: pointer; background: var(--panel-2);
    transition: border-color .16s, background .16s, transform .16s;
  }
  .drop:hover, .drop:focus-visible { border-color: var(--sage); }
  .drop.over { border-color: var(--sage); background: color-mix(in srgb, var(--sage) 12%, var(--panel-2));
               transform: scale(1.005); }
  .drop .icon { font-size: 26px; color: var(--sage); line-height: 1; }
  .drop .title { font-weight: 600; font-size: var(--fs-base); margin-top: 12px; }
  .drop .sub { color: var(--faint); font-size: var(--fs-sm); margin-top: 5px; }

  /* ------------- file list ------------- */
  .files { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .files li { display: flex; align-items: center; gap: 10px; font-size: var(--fs-md);
              background: var(--panel-2); border: 1px solid var(--line);
              border-radius: 10px; padding: 9px 12px; }
  .files .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .size { font: var(--fs-xs) var(--mono); color: var(--faint); flex: none; }
  .files .state { font-size: var(--fs-sm); color: var(--muted); flex: none; }
  .files .state.done { color: var(--sage-deep); }
  .files .state.bad { color: var(--err); }
  .files .del { border: none; background: none; color: var(--faint); cursor: pointer;
                font-size: var(--fs-md); padding: 0 2px; flex: none; }
  .files .del:hover { color: var(--err); }
  .files:empty { display: none; }

  .row { display: flex; align-items: center; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
  .row .notice { flex: 1; min-width: 140px; }

  /* ------------- progress ------------- */
  .progress { height: 6px; border-radius: 3px; background: var(--panel-2);
              border: 1px solid var(--line); overflow: hidden; margin-top: 16px; }
  .progress .bar { height: 100%; width: 0; border-radius: 3px;
                   background: linear-gradient(90deg, var(--sage), var(--dusk)); transition: width .25s; }
  /* No total is known while the server parses, so that phase pulses instead of
     claiming a fraction of a job it cannot measure. */
  .progress.unknown .bar { width: 35%; animation: slide 1.5s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }

  /* ------------- done ------------- */
  .done { text-align: center; }
  .done .tick { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 14px;
                line-height: 44px; font-size: 22px; color: var(--on-accent);
                background: linear-gradient(135deg, var(--sage), var(--dusk)); }
  .done h2 { font-size: var(--fs-lg); font-weight: 650; }
  .done .body { color: var(--muted); font-size: var(--fs-md); margin-top: 7px; }
  .done .row { justify-content: center; }
</style>
</head>
<body data-page="upload">

<div class="gate" id="gate" hidden></div>

<div id="shell" hidden>
  <nav class="nav" id="nav"></nav>

  <main class="wrap">
    <div class="hero">
      <h1 data-i18n="upload.title"></h1>
      <p data-i18n="upload.sub"></p>
    </div>

    <!-- which corpus the files join -->
    <section class="card">
      <div class="field">
        <label for="corpus" data-i18n="upload.corpus.label"></label>
        <select class="select" id="corpus"></select>
      </div>
      <div class="field" id="name-field" hidden>
        <label for="corpus-name" data-i18n="upload.corpus.name"></label>
        <input class="input" id="corpus-name" data-i18n-placeholder="upload.corpus.placeholder">
        <p class="help" data-i18n="upload.corpus.hint"></p>
      </div>
      <p class="help mono" id="corpus-info"></p>
    </section>

    <!-- the files -->
    <section class="card">
      <div class="drop" id="drop" tabindex="0" role="button" aria-describedby="drop-sub">
        <div class="icon">↑</div>
        <div class="title" data-i18n="upload.drop"></div>
        <div class="sub" id="drop-sub" data-i18n="upload.drop.sub"></div>
      </div>
      <input type="file" id="picker" multiple hidden>

      <ul class="files" id="files"></ul>
      <div class="progress" id="progress" hidden><div class="bar" id="bar"></div></div>

      <div class="row">
        <button class="btn btn-primary" id="go" data-i18n="upload.go"></button>
        <span class="notice" id="err" role="alert"></span>
      </div>
    </section>

    <section class="card done" id="done" hidden>
      <div class="tick">✓</div>
      <h2 data-i18n="upload.done.title"></h2>
      <p class="body" id="done-body"></p>
      <div class="row">
        <a class="btn btn-primary" id="to-chat" data-i18n="upload.done.chat"></a>
        <button class="btn" id="more" data-i18n="upload.done.more"></button>
      </div>
    </section>
  </main>
</div>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
<script>
"use strict";

const POLL_MS = 1500;

let suffixes = [];
let picked = [];        // File objects waiting to be uploaded
let job = null;         // {sourceId, folder, files, state} once the upload is accepted
let totals = null;      // the last finished status, so a language switch can redraw
let rows = {};          // file name -> chunks the server has indexed
let startedAt = 0;
let timer = null;

/* ------------------------------- helpers ------------------------------- */

function error(message) { $("err").textContent = message || ""; }

function setProgress(fraction) {
  const bar = $("bar");
  $("progress").hidden = false;
  $("progress").classList.toggle("unknown", fraction === null);
  if (fraction !== null) bar.style.width = Math.round(fraction * 100) + "%";
}

function elapsedText() {
  const total = Math.round((Date.now() - startedAt) / 1000);
  return t("time.elapsed", { m: Math.floor(total / 60), s: String(total % 60).padStart(2, "0") });
}

/* ------------------------------- corpora ------------------------------- */

async function loadCorpora() {
  const sources = await api("/space/api/service/asset-file/resource");
  const select = $("corpus");
  const wanted = new URLSearchParams(location.search).get("corpus");
  select.innerHTML = "";
  for (const source of sources) {
    const option = document.createElement("option");
    option.value = String(source.sourceId);
    option.textContent = source.resourceName;
    select.appendChild(option);
  }
  const fresh = document.createElement("option");
  fresh.value = "new";
  fresh.textContent = t("upload.corpus.new");
  select.appendChild(fresh);

  // Land on the corpus the chat page sent us to, else the first one, else a new
  // one — a fresh service has nothing to append to.
  const known = sources.map((s) => String(s.sourceId));
  select.value = known.includes(wanted) ? wanted : (known[0] || "new");
}

async function syncCorpus() {
  const value = $("corpus").value;
  const isNew = value === "new";
  $("name-field").hidden = !isNew;
  if (isNew) { $("corpus-info").textContent = ""; return; }
  if (/^\d+$/.test(value)) $("corpus-info").textContent = t("upload.corpus.id", { id: value });
  try {
    const status = await api("/api/upload/status?sourceId=" + value);
    $("corpus-info").textContent = status.state === "processing"
      ? t("upload.file.parsing")
      : t("upload.done.body", { documents: status.documents, chunks: status.chunks });
  } catch (err) { /* the id line stands on its own */ }
}

/* -------------------------------- files -------------------------------- */

function addFiles(list) {
  const rejected = [];
  for (const file of list) {
    const dot = file.name.lastIndexOf(".");
    const suffix = dot < 0 ? "" : file.name.slice(dot).toLowerCase();
    // With no list from the service yet, accept and let the server answer:
    // guessing would reject files it would have taken.
    if (suffixes.length && !suffixes.includes(suffix)) { rejected.push(file.name); continue; }
    if (!picked.some((kept) => kept.name === file.name)) picked.push(file);
  }
  error(rejected.length ? t("upload.reject.suffix", { name: rejected.join(", ") }) : "");
  renderFiles();
}

/* The pre-upload list: what is about to be sent, and how to take it back. */
function renderFiles() {
  const list = $("files");
  list.innerHTML = "";
  for (const file of picked) {
    const row = document.createElement("li");
    const name = document.createElement("span");
    name.className = "name"; name.textContent = file.name; name.title = file.name;
    const size = document.createElement("span");
    size.className = "size"; size.textContent = humanSize(file.size);
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.title = t("upload.remove");
    del.addEventListener("click", () => {
      picked = picked.filter((kept) => kept !== file);
      renderFiles();
    });
    row.append(name, size, del);
    list.appendChild(row);
  }
}

/* The list after upload: what the server made of each file, by name. */
function renderJob() {
  const list = $("files");
  list.innerHTML = "";
  for (const file of job.files) {
    const chunks = rows[file.name] || 0;
    const row = document.createElement("li");
    const name = document.createElement("span");
    name.className = "name"; name.textContent = file.name; name.title = file.name;
    const size = document.createElement("span");
    size.className = "size"; size.textContent = humanSize(file.size);
    const state = document.createElement("span");
    state.className = "state" + (job.state === "failed" ? " bad" : (chunks ? " done" : ""));
    state.textContent = job.state === "failed" ? t("upload.file.failed")
      : chunks ? t("upload.file.done", { n: chunks })
      : job.state === "finish" ? t("upload.file.none")
      : t("upload.file.parsing");
    row.append(name, size, state);
    list.appendChild(row);
  }
}

/* -------------------------------- upload ------------------------------- */

function startUpload() {
  if (!picked.length) { error(t("upload.needFiles")); return; }
  const params = new URLSearchParams();
  if ($("corpus").value === "new") {
    const name = $("corpus-name").value.trim();
    if (!name) { error(t("upload.needName")); $("corpus-name").focus(); return; }
    params.set("folder", name);
  } else {
    params.set("sourceId", $("corpus").value);
  }

  const body = new FormData();
  for (const file of picked) body.append("files", file);

  error("");
  $("go").disabled = true;
  $("corpus").disabled = true;
  $("done").hidden = true;
  setProgress(0);
  $("go").textContent = t("upload.uploading", { pct: 0 });

  // XHR rather than fetch: it is the only way to see upload progress.
  const request = new XMLHttpRequest();
  request.open("POST", "/api/upload?" + params.toString());
  request.upload.addEventListener("progress", (event) => {
    if (!event.lengthComputable) return;
    const fraction = event.loaded / event.total;
    setProgress(fraction);
    $("go").textContent = t("upload.uploading", { pct: Math.round(fraction * 100) });
  });
  request.addEventListener("load", () => {
    let payload = null;
    try { payload = JSON.parse(request.responseText); } catch { /* not our envelope */ }
    if (request.status !== 200 || !payload || payload.code !== 0) {
      finishWithError((payload && payload.msg) || ("HTTP " + request.status));
      return;
    }
    watchIngest(payload.data);
  });
  request.addEventListener("error", () => finishWithError("network error"));
  request.send(body);
}

/* The bytes are in; the parsing is not. Poll until the folder's job settles. */
function watchIngest(result) {
  job = { sourceId: result.sourceId, folder: result.folder, files: result.files, state: "processing" };
  rows = {};
  picked = [];
  startedAt = Date.now();
  setProgress(null);
  renderJob();
  $("go").textContent = t("upload.parsing", { elapsed: elapsedText() });
  poll();
  timer = setInterval(poll, POLL_MS);
}

async function poll() {
  if (!job) return;
  let status = null;
  try {
    status = await api("/api/upload/status?sourceId=" + job.sourceId);
  } catch (err) {
    return;  // a dropped poll is not a failed ingest; the next tick retries
  }
  for (const file of status.files) rows[file.name] = file.chunks;
  job.state = status.state;
  renderJob();
  $("go").textContent = t("upload.parsing", { elapsed: elapsedText() });
  if (status.state === "processing") return;
  clearInterval(timer); timer = null;
  if (status.state === "failed") { finishWithError(t("upload.errFailed")); return; }
  finish(status);
}

function finish(status) {
  totals = status;
  $("progress").hidden = true;
  $("go").hidden = true;
  $("err").textContent = "";
  $("done-body").textContent = t("upload.done.body", {
    documents: status.documents, chunks: status.chunks,
  });
  $("to-chat").href = "/?corpus=" + job.sourceId;
  $("done").hidden = false;
  $("done").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function finishWithError(message) {
  if (timer) { clearInterval(timer); timer = null; }
  $("progress").hidden = true;
  $("go").hidden = false;
  $("go").disabled = false;
  $("go").textContent = t("upload.go");
  error(message);
}

/* -------------------------------- wiring ------------------------------- */

function wire() {
  const drop = $("drop");
  drop.addEventListener("click", () => $("picker").click());
  drop.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); $("picker").click(); }
  });
  drop.addEventListener("dragover", (event) => { event.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (event) => {
    event.preventDefault();
    drop.classList.remove("over");
    addFiles(event.dataTransfer.files);
  });
  // A file dropped anywhere else would navigate away from the page.
  window.addEventListener("dragover", (event) => event.preventDefault());
  window.addEventListener("drop", (event) => event.preventDefault());

  $("picker").addEventListener("change", (event) => {
    addFiles(event.target.files);
    event.target.value = "";   // so choosing the same file twice still fires
  });
  $("corpus").addEventListener("change", syncCorpus);
  $("go").addEventListener("click", startUpload);
  $("more").addEventListener("click", async () => {
    job = null; rows = {}; totals = null; picked = [];
    $("done").hidden = true;
    $("go").hidden = false;
    $("go").disabled = false;
    $("corpus").disabled = false;
    $("go").textContent = t("upload.go");
    renderFiles();
    await loadCorpora();
    await syncCorpus();
  });
  // Anything already on screen has to be redrawn in the new language.
  window.addEventListener("chillrag:lang", () => {
    if (job && job.state === "processing") renderJob();
    if (totals) $("done-body").textContent = t("upload.done.body", {
      documents: totals.documents, chunks: totals.chunks,
    });
    syncCorpus();
  });
}

(async () => {
  await bootPage(async () => {
    $("shell").hidden = false;
    wire();   // wired first: a failed list fetch must not leave the page inert
    try {
      const config = await api("/api/ui/config");
      suffixes = config.suffixes;
      $("picker").accept = suffixes.join(",");
      await loadCorpora();
      await syncCorpus();
    } catch (err) {
      error(err.message);
    }
    $("drop").focus();
  });
})();
</script>
</body>
</html>
